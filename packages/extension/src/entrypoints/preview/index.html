<!doctype html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="../../ui/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- A stand-in for any website, for the Settings page to show the real overlay on. -->

      <p class="heading">Any website</p>
      <div class="bar"></div>
      <div class="bar"></div>

      <div class="bar short"></div>
      <span class="link" data-spot="click">Next page</span>
    </div>

    <script type="module" src="./main.ts"></script>
