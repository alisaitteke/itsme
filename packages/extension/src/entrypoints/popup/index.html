<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>itsme</title>
    <link rel="stylesheet" href="../../ui/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <span id="dot" class="dot" data-state="disconnected"></span>
      <div>
        <h1>itsme</h1>
        <p id="status" role="status">Checking…</p>
      </div>
    </header>

    <div class="actions">
      <button id="share" type="button" disabled>Share this tab</button>
      <small>itsme only sees the tabs in its own tab groups.</small>
      <button id="add" type="button" class="secondary">Add to an AI app</button>
      <button id="automations" type="button" class="secondary">Automations</button>
    </div>

    <footer>
      <button id="power" type="button" class="link"></button>
      <button id="settings" type="button" class="link">Settings</button>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
