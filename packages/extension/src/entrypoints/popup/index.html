<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>itsme</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <span id="dot" class="dot" data-state="disconnected"></span>
      <div>
        <h1>itsme</h1>
        <p id="status" role="status">Checking…</p>
      </div>
    </header>

    <section class="share">
      <button id="share" type="button" disabled>Share this tab</button>
      <small>itsme only sees the tabs in its tab group.</small>
    </section>

    <form id="settings">
      <label class="toggle">
        <span>Allow the MCP server to control this browser</span>
        <input id="enabled" type="checkbox" />
      </label>
      <label id="real-input-row" class="toggle" hidden>
        <span>
          Real mouse and keyboard input
          <small>The browser shows a debugging bar while it is in use.</small>
        </span>
        <input id="real-input" type="checkbox" />
      </label>
      <label>
        <span>Port</span>
        <input id="port" type="number" min="1" max="65535" required />
      </label>
      <label>
        <span>Token</span>
        <input id="token" type="password" autocomplete="off" placeholder="Only if the server sets one" />
      </label>
      <button type="submit">Save</button>
    </form>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
