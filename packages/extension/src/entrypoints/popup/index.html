<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>itsme</title>
    <link rel="stylesheet" href="../../ui/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <span class="brand" translate="no"><span id="mark"></span>itsme</span>
      <span id="status" class="status" role="status">Checking…</span>
    </header>

    <p id="help" class="notice" hidden></p>

    <section class="tab" aria-labelledby="site">
      <h1 id="site">This tab</h1>
      <p id="tab-note" class="muted"></p>
      <button id="share" type="button" class="button wide" disabled>Share this tab</button>
    </section>

    <nav class="links" aria-label="More">
      <a id="automations" href="/automations.html" target="_blank">
        <span>Automations</span>
        <span id="review" class="count" hidden></span>
      </a>
      <a id="add" href="/setup.html" target="_blank"><span>Connect an AI app</span></a>
      <a id="settings" href="/options.html" target="_blank"><span>Settings</span></a>
    </nav>

    <label class="row power">
      <span class="words">
        <span id="power-name" class="name">itsme is on</span>
        <span id="power-desc" class="desc">Your AI apps can use this browser.</span>
      </span>
      <input id="power" type="checkbox" class="switch" />
    </label>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
